<title>Video Adı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Dikey anlatım videosu: koyu noktalı zemin, sol üstte kelime kelime akan cümle, ortada sahne görseli, sol altta konuşan avatar */
:root{
  --zemin:#0D0D0E; --nokta:rgba(255,255,255,.055); --yazi:#F4F4EF; --soluk:#6A6A66; --kart:#19191B; --kenar:#2B2B2F;
  --vurgu:#D7F77A; --ikinci:#F2508A; --marka:#2064E3;
  --f-baslik:'Inter Tight',system-ui,sans-serif; --f-el:'Instrument Serif',Georgia,serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#050505;color:var(--yazi);font-family:var(--f-baslik);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;overflow:hidden}
.sahne-kutu{position:relative;flex:0 0 auto}
.frame{position:absolute;left:0;top:0;width:540px;height:960px;transform-origin:0 0;overflow:hidden;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  background-color:var(--zemin);background-image:radial-gradient(var(--nokta) 1px,transparent 1.3px);background-size:7px 7px}
body.rec .frame{border-radius:0;box-shadow:none}
body.rec .kontrol{display:none}
.kontrol{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font:500 13px var(--f-mono)}
.kontrol button{font:700 13px var(--f-mono);background:#1B1B1E;color:var(--yazi);border:1px solid #333;border-radius:999px;padding:8px 14px;cursor:pointer}
.kontrol button:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}
.kontrol .zaman{color:#9a9a94;min-width:92px;text-align:center}

/* üst etiket ve akan cümle */
.cip{position:absolute;left:34px;top:62px;z-index:5;font:700 11px/1 var(--f-mono);letter-spacing:.14em;color:#111;background:var(--vurgu);padding:7px 12px;border-radius:999px}
.cumle{position:absolute;left:34px;top:94px;width:472px;z-index:5;font:800 31px/1.14 var(--f-baslik);letter-spacing:-.012em;color:var(--yazi);text-wrap:balance}
.cumle .ob{display:none}
.cumle .ob.on{display:block}
.cumle .k{display:inline-block;margin-right:.23em;opacity:0;will-change:transform}
.cumle .s-l{color:var(--vurgu)}
.cumle .s-s{font-family:var(--f-el);font-style:italic;font-weight:400;font-size:1.2em;letter-spacing:0;line-height:.9}
.cumle .s-g{color:var(--soluk)}

/* sahneler: görsel alan .vis = 540x440, frame'de y 236–676; avatar sol altta (x 2–218, y 711–960) */
.scene{position:absolute;inset:0;visibility:hidden}
.scene.on{visibility:visible}
.vis{position:absolute;left:0;top:236px;width:540px;height:440px}
.a{opacity:0}
.scene.on .a{animation:var(--an,rise) var(--du,.6s) cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.frame.paused *{animation-play-state:paused!important}
/* .a ile kullanılan her keyframe opacity:1 içermeli */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dus{0%{opacity:0;transform:translateY(-90px) rotate(var(--r0,0deg))}70%{opacity:1;transform:translateY(6px) rotate(var(--r,0deg))}100%{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
@keyframes slideR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-24deg)}70%{opacity:1;transform:scale(.94) rotate(-10deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes buyu{from{opacity:1;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes yaz{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes soluk{from{opacity:1}to{opacity:.25;filter:grayscale(1)}}
@keyframes titre{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(-4deg)}40%{transform:rotate(3deg)}50%{transform:rotate(0)}}
@keyframes dalga{from{opacity:.7;transform:scale(.7)}to{opacity:0;transform:scale(1.7)}}
@keyframes nabiz{0%,100%{box-shadow:0 0 0 0 rgba(215,247,122,.55)}50%{box-shadow:0 0 0 10px rgba(215,247,122,0)}}

/* ortak parçalar */
.kart{position:absolute;background:var(--kart);border:1.5px solid var(--kenar);border-radius:16px;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.tel{position:absolute;width:196px;height:370px;border-radius:32px;background:#151517;border:2px solid #2E2E33;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:34px 16px 18px;box-sizing:border-box}
.tel::before{content:"";position:absolute;top:11px;left:50%;width:58px;height:14px;margin-left:-29px;border-radius:9px;background:#0A0A0B}
.ikon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.mono{font-family:var(--f-mono)}

/* Örnek S0: soru balonu + telefon */
.s0-tel{left:262px;top:14px;text-align:center}
.s0-tel .mono{font-size:11px;color:#8d8d88;letter-spacing:.12em}
.s0-kisi{position:relative;width:78px;height:78px;margin:26px auto 14px;border-radius:50%;background:var(--ikinci);color:#fff;font:800 28px/78px var(--f-baslik)}
.s0-kisi i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ikinci);opacity:0}
.scene.on .s0-kisi i{animation:dalga 1.4s ease-out infinite}
.scene.on .s0-kisi i+i{animation-delay:.7s}
.s0-ad{font:800 21px var(--f-baslik)}
.scene.on .s0-titre{animation:titre 1.1s ease-in-out .8s infinite}
.s0-balon{position:absolute;left:18px;top:206px;max-width:232px;box-sizing:border-box;background:var(--vurgu);color:#111;font:800 24px/1.12 var(--f-baslik);padding:15px 18px;border-radius:22px 22px 22px 6px;box-shadow:0 14px 34px rgba(0,0,0,.45)}

/* Örnek S1: büyük vurgu dairesi + logo (geçiş sahnesi) */
.s1-halka{position:absolute;left:40px;top:-24px;width:500px;height:500px;border-radius:50%;background:var(--vurgu)}
.s1-logo{position:absolute;left:225px;top:96px;width:130px;height:130px;border-radius:30px;background:#fff;display:grid;place-items:center;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.s1-logo svg{width:104px;height:104px}
.s1-ad{position:absolute;left:110px;width:360px;top:250px;text-align:center;font:800 38px/1.02 var(--f-baslik);color:#0D0D0E;letter-spacing:-.02em}

/* Örnek S2: kapanış kartı */
.s2-kart{position:absolute;left:96px;top:22px;width:350px;padding:26px 26px 24px;box-sizing:border-box;border-radius:24px;background:var(--vurgu);color:#111;transform:rotate(-3deg);box-shadow:0 26px 60px rgba(0,0,0,.5);text-align:center}
.s2-kart .mono{font-size:12px;letter-spacing:.16em;font-weight:700}
.s2-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 14px;font:800 24px var(--f-baslik)}
.s2-logo svg{width:48px;height:48px}
.s2-buyuk{font:800 64px/1 var(--f-baslik);letter-spacing:-.03em}
.s2-alt{font:700 22px var(--f-baslik);margin:4px 0 18px}
.s2-url{display:inline-block;background:#111;color:var(--vurgu);font:700 17px var(--f-mono);padding:11px 16px;border-radius:12px}

/* avatar: pozlar (p-*), yüz (y-*), efektler (e-*) sınıflarla açılır */
.av-kutu{position:absolute;left:2px;bottom:0;width:216px;height:249px;z-index:6;transform-origin:50% 100%}
.avatar{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 1.3px rgba(255,255,255,.8))}
.avatar .agiz,.avatar .poz,.avatar .av-ter,.avatar .av-unlem{display:none}
.av-kutu.y-gulus .agiz-gulus,.av-kutu.y-acik .agiz-acik,.av-kutu.y-o .agiz-o,.av-kutu.y-yarim .agiz-yarim{display:inline}
.av-kutu.p-isaret .poz-isaret,.av-kutu.p-sun .poz-sun,.av-kutu.p-dusun .poz-dusun{display:inline}
.av-kutu.p-isaret .kol-sag-dur,.av-kutu.p-sun .kol-sag-dur,.av-kutu.p-dusun .kol-sol-dur{display:none}
.av-kutu.e-ter .av-ter,.av-kutu.e-unlem .av-unlem{display:inline}
.av-bas{transform-box:view-box;transform-origin:120px 165px}
.gozler{transform-box:view-box;transform-origin:120px 104px}
@media (prefers-reduced-motion:reduce){.scene.on .s0-titre,.scene.on .s0-kisi i{animation:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<!--LOGO-->
  <symbol id="i-tel" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
</svg>

<div class="sahne-kutu" id="kutu">
<div class="frame" id="frame">
  <div class="cip">MARKA ADI</div>
  <div class="cumle" id="cumle"></div>

  <!--
    Sahne öznitelikleri:
      data-dur    sahne süresi (sn)
      data-alen   seslendirme süresi (sn); boşsa kelimeler sürenin %62'sine yayılır
      data-sub    akan cümle = seslendirme metni. "|" öbek ayırır (öbek bitince silinir),
                  *vurgu rengi*, _el yazısı_, ~soluk~
      data-poz    avatar pozu zaman çizelgesi: "dusun@0,dur@2.6"  (dur | isaret | sun | dusun)
      data-yuz    konuşma bitince kalan yüz: gulus | o | yarim | acik
      data-efekt  "ter@1.4,unlem@.5"
  -->

  <!-- S0: kanca -->
  <section class="scene" data-dur="6" data-alen="" data-poz="dusun@0,dur@2.6" data-yuz="gulus" data-efekt="" data-sub="Bir işletmede | en çok duyulan soru: | *Ne zaman hazır olur?*">
    <div class="vis">
      <div class="a" style="--an:dus;--d:.15s;--du:.8s;position:absolute;inset:0">
        <div class="tel s0-tel s0-titre">
          <div class="mono">GELEN ARAMA</div>
          <div class="s0-kisi">AB<i></i><i></i></div>
          <div class="s0-ad">Örnek Müşteri</div>
        </div>
      </div>
      <div class="s0-balon a" style="--an:pop;--d:2.2s">“Ne zaman hazır olur?”</div>
    </div>
  </section>

  <!-- S1: çözüm geçişi -->
  <section class="scene" data-dur="5.5" data-alen="" data-poz="isaret@.5" data-yuz="gulus" data-efekt="unlem@.5" data-sub="_İşte_ ben | bu yüzden | *Ürün Adı*'nı yaptım.">
    <div class="vis">
      <div class="s1-halka a" style="--an:buyu;--d:.1s;--du:.7s"></div>
      <div class="s1-logo a" style="--an:pop;--d:.8s"><svg><use href="#logo"/></svg></div>
      <div class="s1-ad a" style="--an:rise;--d:1.6s">Ürün Adı</div>
    </div>
  </section>

  <!-- S2: kapanış -->
  <section class="scene" data-dur="6" data-alen="" data-poz="sun@.3" data-yuz="gulus" data-efekt="" data-sub="_Siz_ işinize bakın, | gerisini *biz halledelim.* | ornek.com">
    <div class="vis">
      <div class="s2-kart a" style="--an:pop;--d:.2s;--du:.7s">
        <div class="mono">KISA TANIM</div>
        <div class="s2-logo"><svg><use href="#logo"/></svg><span>Ürün Adı</span></div>
        <div class="s2-buyuk">14 gün</div>
        <div class="s2-alt">ücretsiz deneyin</div>
        <div class="s2-url a" style="--an:pop;--d:2.6s">ornek.com</div>
      </div>
    </div>
  </section>

  <div class="av-kutu" id="avk">
<!--AVATAR-->
  </div>
</div>
</div>

<div class="kontrol">
  <button id="oynat" type="button">Duraklat</button>
  <button id="bastan" type="button">Baştan</button>
  <span class="zaman" id="zaman">0,0 / 0,0 sn</span>
  <button id="kayit" type="button">Kayıt modu</button>
</div>

<script>
(function(){
  const frame=document.getElementById('frame'), kutu=document.getElementById('kutu'), cumle=document.getElementById('cumle'), avk=document.getElementById('avk');
  const bas=avk.querySelector('.av-bas'), gozler=avk.querySelector('.gozler');
  const scenes=[...frame.querySelectorAll('.scene')];
  const durs=scenes.map(s=>parseFloat(s.dataset.dur));
  const total=durs.reduce((a,b)=>a+b,0);
  let idx=0,t=0,playing=true,last=null,kelimeler=[],obekler=[];

  function zamanCiz(v){return (v||'').split(',').filter(Boolean).map(x=>{const [ad,z]=x.split('@');return {ad:ad.trim(),z:parseFloat(z||0)}}).sort((a,b)=>a.z-b.z)}
  function hangisi(liste,tt){let s=null;for(const x of liste){if(tt>=x.z)s=x.ad}return s}

  // "*vurgu*", "_el yazısı_", "~soluk~" işaretleri; "|" öbek ayırır
  function cozumle(sub){
    const obs=[];let stil='';
    sub.split('|').forEach(ob=>{
      const ks=[];
      ob.trim().split(/\s+/).forEach(k=>{
        const parca=[];let buf='';
        for(const c of k){
          if(c==='*'||c==='_'||c==='~'){
            if(buf){parca.push([buf,stil]);buf=''}
            const s={'*':'s-l','_':'s-s','~':'s-g'}[c];
            stil=(stil===s)?'':s;
          } else buf+=c;
        }
        if(buf)parca.push([buf,stil]);
        if(parca.length)ks.push(parca);
      });
      obs.push(ks);
    });
    return obs;
  }

  function show(i){
    scenes.forEach(s=>s.classList.remove('on'));
    void frame.offsetWidth;
    scenes[i].classList.add('on');
    cumle.innerHTML='';kelimeler=[];obekler=[];
    cozumle(scenes[i].dataset.sub).forEach(ob=>{
      const d=document.createElement('div');d.className='ob';
      ob.forEach(parca=>{
        const w=document.createElement('span');w.className='k';
        parca.forEach(([m,s])=>{const e=document.createElement('span');if(s)e.className=s;e.textContent=m;w.appendChild(e)});
        d.appendChild(w);kelimeler.push({el:w,ob:obekler.length});
      });
      cumle.appendChild(d);obekler.push(d);
    });
    scenes[i]._poz=zamanCiz(scenes[i].dataset.poz);
    scenes[i]._efekt=zamanCiz(scenes[i].dataset.efekt);
  }

  function render(){
    const sc=scenes[idx],dur=durs[idx];
    const al=parseFloat(sc.dataset.alen||0);
    const start=al?.3:.35, span=al?al*.9:dur*.62, n=kelimeler.length;
    let aktif=-1;
    kelimeler.forEach((k,j)=>{
      const tj=start+span*j/n, p=Math.max(0,Math.min(1,(t-tj)/.16));
      if(t>=tj)aktif=k.ob;
      k.el.style.opacity=p;k.el.style.transform='translateY('+((1-p)*10).toFixed(1)+'px)';
    });
    obekler.forEach((o,j)=>o.classList.toggle('on',j===aktif));

    // avatar: poz, yüz, efekt, konuşma ağzı, göz kırpma, baş sallanması (hepsi t'den hesaplanır, render'da deterministik)
    const konusma=al||dur*.7, konusuyor=t>.3&&t<.3+konusma;
    let yuz=sc.dataset.yuz||'gulus';
    if(konusuyor){const ph=Math.floor((t-.3)*9);yuz=['acik','yarim','acik','gulus','yarim','acik','yarim'][(ph*5+idx)%7]}
    const poz=hangisi(sc._poz,t)||'dur', ef=sc._efekt.filter(x=>t>=x.z).map(x=>'e-'+x.ad);
    avk.className='av-kutu y-'+yuz+' p-'+poz+(ef.length?' '+ef.join(' '):'');
    const gt=(t+idx*1.3)%3.6;
    gozler.style.transform=gt<.13?'scaleY(.12)':'none';
    const sal=konusuyor?Math.sin(t*4.3)*2.2:Math.sin(t*1.4)*.8;
    bas.style.transform='rotate('+sal.toFixed(2)+'deg)';
    avk.style.transform='translateY('+(Math.sin(t*1.7)*1.6).toFixed(2)+'px)';

    let g=t;for(let i=0;i<idx;i++)g+=durs[i];
    document.getElementById('zaman').textContent=g.toFixed(1).replace('.',',')+' / '+total.toFixed(1).replace('.',',')+' sn';
  }

  function go(i){idx=(i+scenes.length)%scenes.length;t=0;show(idx);render()}
  function setPlay(p){playing=p;frame.classList.toggle('paused',!p);document.getElementById('oynat').textContent=p?'Duraklat':'Oynat'}
  function loop(ts){
    if(last==null)last=ts;
    const dt=(ts-last)/1000;last=ts;
    if(playing){t+=dt;if(t>=durs[idx]){go(idx+1);}else render()}
    requestAnimationFrame(loop);
  }
  function fit(){
    const rec=document.body.classList.contains('rec');
    const w=window.innerWidth-(rec?0:32), h=window.innerHeight-(rec?0:80);
    const s=Math.min(w/540,h/960,rec?10:1.2);
    frame.style.transform='scale('+s+')';kutu.style.width=540*s+'px';kutu.style.height=960*s+'px';
  }
  document.getElementById('oynat').onclick=()=>setPlay(!playing);
  document.getElementById('bastan').onclick=()=>{go(0);setPlay(true)};
  document.getElementById('kayit').onclick=()=>{document.body.classList.add('rec');fit();try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}go(0);setPlay(true)};
  document.addEventListener('keydown',e=>{
    if(e.key===' '){e.preventDefault();setPlay(!playing)}
    else if(e.key==='ArrowRight')go(idx+1);
    else if(e.key==='ArrowLeft')go(idx-1);
    else if(e.key==='Escape'){document.body.classList.remove('rec');fit()}
  });
  window.addEventListener('resize',fit);
  fit();go(0);requestAnimationFrame(loop);
})();
</script>
